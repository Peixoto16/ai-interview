# Review automático com Claude a cada Pull Request.
# Precisa de UM destes secrets no GitHub (Settings > Secrets and variables > Actions):
#   - CLAUDE_CODE_OAUTH_TOKEN  (usa sua assinatura Claude Pro/Max; gere com `claude setup-token`)
#   - ANTHROPIC_API_KEY        (cobrado por uso no console.anthropic.com)

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review com Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-sonnet-5-5
            --allowed-tools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você é um revisor de código. Faça o review deste Pull Request.
            Leia o CLAUDE.md e as regras em .claude/rules/ e respeite as convenções do projeto.
            Use `gh pr diff` para ver as mudanças e leia os arquivos necessários para entender o contexto.
            Analise APENAS o que mudou no PR.

            Revise sob estes 6 ângulos (como se fossem 6 revisores):
            1. Security — segredos expostos, injeção, validação de entrada.
            2. Correctness — bugs de lógica, casos de borda, tipos errados.
            3. Performance — trabalho desnecessário, loops caros.
            4. Simplifier — código que pode ser mais simples ou reaproveitado.
            5. Silent Failures — erros engolidos, catch vazio, falhas sem log/sinal.
            6. Type Design — tipos TypeScript frouxos (any, opcionais demais), invariantes não garantidas.

            Seja rigoroso mas evite falsos positivos: só aponte o que tem cenário concreto de falha.
            Severidades: critical, warning, info.

            Poste UM comentário no PR com `gh pr comment` contendo, em português, nesta ordem:
            - Um bloco de destaque com o veredito: "Aprovado", "Aprovado com comentários" ou "Mudanças necessárias",
              e a contagem (ex.: "1 warning · 1 info").
            - <details><summary>📝 Walkthrough</summary> resumo do que o PR muda </details>
            - <details><summary>🔍 Findings</summary> cada achado com arquivo:linha, severidade, problema e sugestão </details>
            - <details><summary>🤖 Prompt for AI agents</summary> um bloco de código com instruções prontas
              para colar num agente de IA corrigir os achados (começando com
              "Verifique cada achado contra o código atual e só corrija se necessário.") </details>
            - <details open><summary>📊 Resumo por agente</summary> tabela | Agente | Status | Severidade máxima | </details>

            Se não houver nenhum achado, poste o veredito "Aprovado" e a tabela com todos OK.
